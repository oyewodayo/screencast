[package]
name = "Briefcast"
version = "0.0.0"
description = "A screen recording and streaming application for easy use."
authors = ["Temidayo Oyewo"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "dialog-ask", "dialog-save", "window-set-fullscreen", "dialog-open", "global-shortcut-all", "window-hide", "window-set-focus", "window-create", "window-close", "protocol-asset", "window-show", "dialog-message", "shell-open", "window-start-dragging", "dialog", "window-set-ignore-cursor-events", "devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4.38"
image = "0.25.1"
log = "0.4.22"
simplelog = "0.12.2"
urlencoding = "2.1"
base64 = "0.22"
# Backs the Briefcast-folder file watcher (services/file_watcher.rs) that keeps the sidebar's file
# list live when files are added/removed from outside the app (Explorer, another app saving into
# the folder, etc.) - notify-debouncer-mini re-exports a compatible `notify` itself, so it isn't
# also listed as a direct dependency here.
notify-debouncer-mini = "0.7"
# Backs services/docs_search.rs's full-text search index for the Docs feature (DocsHome.tsx's
# search used to decode every doc's full Yjs bytes into memory on every search keystroke, which
# doesn't scale past a modest doc count - see that file's own comment). "bundled" statically links
# SQLite itself rather than requiring one already installed on the machine, which matters a lot for
# a distributed desktop app - and, usefully, libsqlite3-sys's own build script passes
# -DSQLITE_ENABLE_FTS5 unconditionally for every bundled build, so the FTS5 virtual-table module
# the index is built on needs no separate feature flag here. (rusqlite has no feature literally
# named "fts5" at all, in this or any version - confirmed directly against its own Cargo.toml and
# libsqlite3-sys's build.rs after cargo's dependency resolution rejected that name outright.)
rusqlite = { version = "0.31", features = ["bundled"] }

# Win32 bindings — only meaningful (and only compilable) on Windows. Unconditional before this,
# which meant `cargo build` couldn't even start on macOS/Linux regardless of how much of the
# actual source was already portable.
[target.'cfg(windows)'.dependencies]
windows = {version="0.57.0", features = ["Win32_System_SystemInformation", "Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Power", "Win32_Storage_FileSystem", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Devices_Properties", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_Xps", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_System_Com", "Graphics_Imaging", "Storage", "Storage_Streams"] }
# WASAPI loopback capture (system/"what you hear" audio) for recording - see
# services/loopback_audio.rs. Neither device enumeration (get_connected_audios, dshow-based) nor
# ffmpeg itself can capture this on a machine with no Stereo Mix-equivalent device; WASAPI
# loopback is the one universal, driver-independent way to grab it on any Windows install.
wasapi = "0.23"
hound = "3.5"

# Pure-Rust X11 protocol client (talks directly to the X server over its own socket transport —
# no libX11/libxcb .so needed at build or run time) — the closest Linux analog to using the
# `windows` crate for direct Win32 access above. Only the extensions actually used are enabled:
# randr for monitor geometry, composite for window screenshot capture.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr", "composite"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

# `cargo tauri dev` builds this crate itself at opt-level 0 (fast incremental rebuilds while
# iterating), but that setting also applied to every DEPENDENCY - including `image`, whose
# JPEG/HEIC decode-resize-encode path (get_image_thumbnail in commands/conversion.rs) is tight
# numeric/loop code that unoptimized Rust runs roughly one to two orders of magnitude slower than
# release - measured directly against briefcast_preview_cache/thumb_v1: consecutive thumbnails
# landing ~5-8s apart under the shared 4-way thumbnailLimiter, which made a few-hundred-image
# gallery (e.g. a 477-image folder) look permanently blank rather than just slow to fill in, since
# it would take on the order of an hour to finish. Bumping just the dependency graph to opt-level 3
# (this crate's own code, which is what you're actually iterating on, stays unoptimized for fast
# rebuilds) gets `image`/`rusqlite`/etc. back to near-release decode speed with no change to normal
# edit-save-reload turnaround.
[profile.dev.package."*"]
opt-level = 3
