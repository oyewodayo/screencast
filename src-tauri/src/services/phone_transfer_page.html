<!doctype html>
<!--
  The phone side of "Transfer to phone" - served by src-tauri/src/services/phone_transfer.rs.

  Pairs once (the QR's #k= key), then keeps a device id + token in localStorage so every later visit
  reconnects by itself - and only lets go of them when Briefcast says outright (/hello) that it no
  longer knows this phone. It can live on the home screen (manifest + /sw.js), so the header carries
  its own reconnect button: an installed app has no reload. Files Briefcast sends arrive as offers over the WebSocket and are downloaded
  straight from /f/<offer>; "Send to computer" streams the phone's own files up to /u, one at a time.

  Opened over HTTP (what the QR code always points at, because it works on any network), the page
  first asks for this computer's trusted HTTPS name (/tls), checks it really connects from here, and
  if so moves itself there - see lan_tls.rs. Otherwise it simply carries on over HTTP. Self-contained on purpose: no fonts, scripts or icons from the internet,
  since the phone may be on a hotspot with no connection beyond this computer.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0b0b0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Briefcast">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>Briefcast Transfer</title>
<style>
  :root {
    --bg: #f5f5f4; --card: #ffffff; --text: #171717; --muted: #737373; --line: #e5e5e5;
    --accent: #2563eb; --accent-text: #ffffff; --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0b0c; --card: #171717; --text: #f5f5f5; --muted: #a3a3a3; --line: #262626;
      --accent: #3b82f6; --ok: #22c55e; --warn: #f59e0b; --bad: #f87171; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Elements toggled with `hidden` also get a display of their own below, which would win. */
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 28px); }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .logo { width: 32px; height: 32px; flex: none; display: block; }
  @media (prefers-color-scheme: dark) { .logo { filter: invert(1); } }
  .head { flex: 1; min-width: 0; }
  h1 { font-size: 18px; line-height: 1.2; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-top: 2px; min-width: 0; }
  #status { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); } .dot.wait { background: var(--warn); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .retry { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--card);
    color: var(--text); display: grid; place-items: center; padding: 0; }
  .retry:active { transform: scale(.94); }
  .retry.spin svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .notice .row { display: flex; gap: 8px; margin-top: 12px; }
  .notice .row .btn { padding: 9px 12px; font-size: 14px; }
  .who { margin-top: 10px; font-size: 13px; color: var(--muted); text-align: center; }
  .who button { font: inherit; color: var(--text); font-weight: 600; background: none; border: 0; padding: 4px 2px;
    text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  .notice { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .notice h2 { font-size: 15px; margin: 0 0 4px; }
  .notice p { margin: 0; color: var(--muted); font-size: 14px; }
  .code { font: 700 44px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .18em; text-align: center; margin: 14px 0 6px; }
  .warn { border: 1px solid var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
  .warn b { color: var(--warn); }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px;
    display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; container-type: inline-size; }
  .item.new { border-color: var(--accent); }
  .thumb { width: 56px; height: 56px; border-radius: 10px; background: var(--line); overflow: hidden;
    display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .name { font-weight: 600; word-break: break-word; }
  .meta { font-size: 13px; color: var(--muted); }
  .meta .ok { color: var(--ok); } .meta .bad { color: var(--bad); }
  .actions { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 8px; }
  .actions .btn { display: flex; align-items: center; justify-content: center; gap: 7px; height: 46px; padding: 0 10px;
    font: inherit; font-size: 15px; font-weight: 600; line-height: 1; white-space: nowrap; min-width: 0; box-sizing: border-box; }
  .actions .btn > span { overflow: hidden; text-overflow: ellipsis; }
  .when { white-space: nowrap; }
  @container (max-width: 320px) {
    .actions.three { grid-template-columns: 1fr 1fr 46px; }
    .actions .btn.sharebtn { padding: 0; }
    .actions .btn.sharebtn > span { display: none; }
  }
  .btn { flex: 1; text-align: center; text-decoration: none; border-radius: 10px; padding: 11px 12px; font-weight: 600;
    font-size: 15px; border: 1px solid var(--line); color: var(--text); background: transparent; }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  .hint { font-size: 12.5px; color: var(--muted); grid-column: 1 / -1; margin-top: -2px; }
  .empty { text-align: center; color: var(--muted); padding: 48px 12px; }
  .empty .big { font-size: 40px; margin-bottom: 6px; }
  .sender { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 16px; }
  .sender .btn { display: block; width: 100%; }
  .sender .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; font-size: 13px; }
  .sender .row .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 4px; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .15s; }
  .section { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 4px 2px 8px; }
  footer { margin-top: 22px; font-size: 12.5px; color: var(--muted); text-align: center; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 18px); transform: translate(-50%, 20px);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px;
    opacity: 0; transition: .2s; pointer-events: none; max-width: 90vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  /* "Now editing" - shown while a video is open in Briefcast's editor. */
  .timeline { display: flex; align-items: center; gap: 12px; padding: 12px; margin-bottom: 10px; border-radius: 12px;
    background: color-mix(in srgb, var(--accent) 9%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    animation: rise .25s ease-out; }
  .tl-icon { width: 38px; height: 38px; border-radius: 10px; flex: none; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-text); }
  .tl-text { min-width: 0; }
  .tl-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .tl-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sender .btn.second { margin-top: 8px; }
  /* While a share waits, its card holds the buttons - one choice on screen, not two. */
  .sender.quiet .timeline, .sender.quiet label.btn { display: none; }
  .row .tag { font-size: 11px; color: var(--accent); margin-right: 4px; }
  /* What Android's share sheet handed over, waiting to be sent. */
  .share { background: var(--card); border: 1px solid var(--accent); border-radius: 14px; padding: 14px; margin-bottom: 12px;
    animation: rise .25s ease-out; box-shadow: 0 6px 24px color-mix(in srgb, var(--accent) 14%, transparent); }
  .share-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .share-head h2 { font-size: 16px; margin: 0; }
  .x { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--muted);
    font-size: 18px; line-height: 1; padding: 0; flex: none; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .tile { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--line);
    display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
  .tile img, .tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tile .badge { position: absolute; right: 4px; bottom: 4px; background: rgba(0,0,0,.65); color: #fff; font-size: 10.5px;
    font-weight: 600; padding: 1px 5px; border-radius: 6px; letter-spacing: 0; }
  .tile.more { font-size: 15px; color: var(--text); }
  .share .meta { margin: 10px 2px 12px; }
  .share .btn { display: block; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .share .btn + .btn { margin-top: 8px; }
  .btn:disabled { opacity: .45; }
  /* Share: straight on to TikTok, Instagram, YouTube... through the phone's own share sheet. */
  .btn.sharebtn { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 7px;
    border: 1px solid transparent; color: var(--text);
    background: linear-gradient(var(--card), var(--card)) padding-box,
      linear-gradient(120deg, #f58529, #dd2a7b 40%, #8134af 70%, #515bd4) border-box; }
  .btn.sharebtn svg { flex: none; color: #dd2a7b; }
  .btn.sharebtn span, .btn.sharebtn svg { position: relative; }
  .btn.sharebtn .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; transition: width .15s;
    background: linear-gradient(120deg, rgba(245,133,41,.16), rgba(221,42,123,.18), rgba(81,91,212,.16)); }
  .btn.sharebtn.ready { animation: share-ready 1.5s ease-in-out infinite; }
  @keyframes share-ready { 50% { box-shadow: 0 0 0 5px rgba(221,42,123,.16); } }
</style>
</head>
<body>
<main>
  <header>
    <img class="logo" src="/icons/logo-96.png" alt="" width="32" height="32">
    <div class="head">
      <h1>Briefcast Transfer</h1>
      <div class="sub"><span id="dot" class="dot wait"></span><span id="status">Connecting…</span></div>
    </div>
    <button id="retry" class="retry" type="button" aria-label="Reconnect" title="Reconnect" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>
  <div id="security"></div>
  <div id="notice"></div>
  <div id="install" class="notice" hidden>
    <h2 id="install-title"></h2>
    <p id="install-body"></p>
    <div class="row">
      <button id="install-go" class="btn primary" type="button"></button>
      <button id="install-later" class="btn" type="button">Not now</button>
    </div>
  </div>
  <div id="share" class="share" hidden>
    <div class="share-head">
      <h2 id="share-title"></h2>
      <button id="share-discard" class="x" type="button" aria-label="Discard" title="Discard">×</button>
    </div>
    <div id="share-grid" class="grid"></div>
    <p id="share-meta" class="meta"></p>
    <button id="share-tl" class="btn primary" type="button" hidden></button>
    <button id="share-lib" class="btn" type="button"></button>
  </div>
  <div id="sender" class="sender" hidden>
    <div id="timeline" class="timeline" hidden>
      <div class="tl-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 9.5h4M17 9.5h4M3 14.5h4M17 14.5h4"/></svg>
      </div>
      <div class="tl-text"><div class="tl-label">Open in Briefcast</div><div id="tl-name" class="tl-name"></div></div>
    </div>
    <label id="add-tl" class="btn primary" for="pick-tl" hidden>Add to timeline</label>
    <input id="pick-tl" type="file" multiple accept="image/*,video/*,audio/*" hidden>
    <label id="send-lib" class="btn primary" for="pick">Send to computer</label>
    <input id="pick" type="file" multiple hidden>
    <div id="uploads"></div>
    <div class="who">This phone appears as <button id="me" type="button" title="Rename this phone" hidden></button></div>
  </div>
  <div id="received-title" class="section" hidden>Received</div>
  <div id="list" class="list"></div>
  <footer id="footer">Keep this page on your home screen to move files either way. Everything travels over your Wi-Fi in full original quality — no mobile data, no upload to the internet.</footer>
</main>
<div id="toast" class="toast"></div>
<script>
(() => {
  const STORE = "briefcast-transfer";
  const $ = (id) => document.getElementById(id);
  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);

  let creds = null;
  try { creds = JSON.parse(localStorage.getItem(STORE) || "null"); } catch (_) {}
  const saveCreds = () => { try { creds ? localStorage.setItem(STORE, JSON.stringify(creds)) : localStorage.removeItem(STORE); } catch (_) {} };

  // The pairing key only rides in the fragment, which is never sent to the server; strip it so a
  // bookmark of this page is just the address.
  const fragment = new URLSearchParams(location.hash.slice(1));
  let pairKey = fragment.get("k") || "";
  // Handed over by the HTTP page when it moved us onto HTTPS - localStorage is per origin, so
  // without this the phone would have to pair all over again.
  if (fragment.get("d") && fragment.get("t")) {
    creds = { d: fragment.get("d"), t: fragment.get("t"), name: fragment.get("n") || undefined };
    saveCreds();
  }
  // Set by sw.js after Android's share sheet handed files over (or by the server, when it couldn't).
  const shareParam = new URLSearchParams(location.search).get("share");
  if (location.hash || location.search) history.replaceState(null, "", location.pathname);
  const secure = location.protocol === "https:";

  const defaultName = /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) ? "iPad" : /Android/.test(ua) ? "Android phone" : "Phone";
  const offers = new Map();
  // Phone -> computer: one upload at a time - the Wi-Fi link is the bottleneck, so parallel
  // uploads would only make every file finish later.
  const uploads = [];
  let uploading = false;
  let ws = null, welcomed = false, stopped = false, retryTimer = 0, pingTimer = 0, attempt = 0, lastHeard = 0;
  // The computer's name, and the video open in its editor (null when none) - see setTimeline.
  let host = "your computer", timeline = null;
  // "placed" can beat the upload's own response here; held until that response names the id.
  const earlyPlaced = new Map();
  const isMedia = (f) => /^(image|video|audio)\//.test(f.type) ||
    /\.(jpe?g|png|gif|webp|heic|heif|avif|mp4|m4v|mov|webm|mkv|3gp|mp3|m4a|aac|wav|ogg|opus|flac)$/i.test(f.name);

  // The reconnect button shows whenever a paired phone isn't connected, and spins while it tries.
  const setStatus = (text, kind) => {
    $("status").textContent = text; $("dot").className = "dot " + (kind || "");
    $("retry").hidden = kind === "on" || !creds;
    $("retry").classList.toggle("spin", kind === "wait");
    renderShare();
  };
  const toast = (text) => {
    const t = $("toast"); t.textContent = text; t.classList.add("show");
    clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 2600);
  };
  const notice = (title, body) => {
    $("notice").innerHTML = title ? `<div class="notice"><h2></h2><p></p></div>` : "";
    if (title) { $("notice").querySelector("h2").textContent = title; $("notice").querySelector("p").textContent = body; }
  };
  const fmtSize = (n) => {
    if (n < 1024) return n + " B";
    const u = ["KB", "MB", "GB", "TB"]; let i = -1;
    do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
    return n.toFixed(n < 10 ? 1 : 0) + " " + u[i];
  };
  // "12:13", "Yesterday 12:13", "21 Aug, 12:13".
  const fmtWhen = (ms) => {
    if (!ms) return "";
    const d = new Date(ms), now = new Date();
    const time = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    const days = Math.round((new Date(now.toDateString()) - new Date(d.toDateString())) / 864e5);
    if (days === 0) return time;
    if (days === 1) return `Yesterday ${time}`;
    return `${d.toLocaleDateString([], { day: "numeric", month: "short", year: days > 300 ? "numeric" : undefined })}, ${time}`;
  };
  const fileUrl = (id, inline) =>
    `/f/${encodeURIComponent(id)}?d=${encodeURIComponent(creds.d)}&t=${encodeURIComponent(creds.t)}${inline ? "&inline=1" : ""}`;

  const download = (offer) => {
    const a = document.createElement("a");
    a.href = fileUrl(offer.id, false);
    a.download = offer.name;
    document.body.appendChild(a); a.click(); a.remove();
    offer.started = true;
    render();
  };

  function renderUploads() {
    const box = $("uploads");
    box.innerHTML = "";
    for (const u of uploads.slice(-6).reverse()) {
      const row = document.createElement("div");
      const top = document.createElement("div"); top.className = "row";
      const n = document.createElement("span"); n.className = "n"; n.textContent = u.file.name;
      if (u.target === "timeline") { const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = "🎬"; n.prepend(tag); }
      const st = document.createElement("span");
      if (u.state === "done" && u.target === "timeline" && u.placed === undefined) st.textContent = "Adding…";
      else if (u.state === "done" && u.target === "timeline" && u.placed === false) { st.style.color = "var(--muted)"; st.textContent = "✓ In library"; }
      else if (u.state === "done") { st.style.color = "var(--ok)"; st.textContent = u.target === "timeline" ? "✓ On the timeline" : "✓ Sent"; }
      else if (u.state === "failed") { st.style.color = "var(--bad)"; st.textContent = u.error || "Failed"; }
      else if (u.state === "sending") {
        const pct = u.file.size ? Math.floor((u.sent / u.file.size) * 100) : 0;
        st.textContent = `${pct}%${u.speed ? " · " + fmtSize(u.speed) + "/s" : ""}`;
      } else st.textContent = "Waiting…";
      top.append(n, st);
      row.appendChild(top);
      if (u.state === "sending") {
        const bar = document.createElement("div"); bar.className = "bar";
        const fill = document.createElement("i");
        fill.style.width = (u.file.size ? (u.sent / u.file.size) * 100 : 0) + "%";
        bar.appendChild(fill); row.appendChild(bar);
      }
      box.appendChild(row);
    }
  }

  function pump() {
    if (uploading || !creds) return;
    const u = uploads.find((x) => x.state === "waiting");
    if (!u) return;
    uploading = true;
    u.state = "sending"; u.sent = 0; u.speed = 0;
    const started = Date.now();
    const xhr = new XMLHttpRequest();
    const q = new URLSearchParams({ d: creds.d, t: creds.t, name: u.file.name, size: String(u.file.size), to: u.target, batch: u.batch });
    xhr.open("POST", `/u?${q}`);
    // XHR rather than fetch: only XHR reports upload progress. A File body is streamed from
    // storage by the browser, never read into memory whole.
    xhr.upload.onprogress = (e) => {
      u.sent = e.loaded;
      const secs = (Date.now() - started) / 1000;
      u.speed = secs > 0.5 ? e.loaded / secs : 0;
      renderUploads();
    };
    const finish = (ok, error) => {
      u.state = ok ? "done" : "failed"; u.error = error;
      uploading = false;
      if (ok && navigator.vibrate) navigator.vibrate(20);
      renderUploads();
      if (u.share) shareSettled(u);
      // Timeline files are announced once Briefcast says where they landed (batchSettled).
      if (!uploads.some((x) => x.state === "waiting")) {
        const done = uploads.filter((x) => x.state === "done" && x.target !== "timeline" && !x.toasted);
        done.forEach((x) => (x.toasted = true));
        if (done.length) toast(done.length === 1 ? `✓ Sent ${done[0].file.name}` : `✓ Sent ${done.length} files`);
      }
      if (u.target === "timeline") batchSettled(u.batch);
      pump();
    };
    xhr.onload = () => {
      const ok = xhr.status >= 200 && xhr.status < 300;
      if (ok) {
        try { u.id = JSON.parse(xhr.responseText).id; } catch (_) {}
        const early = u.id && earlyPlaced.get(u.id);
        if (early) { earlyPlaced.delete(u.id); u.placed = early.placed; u.note = early.note; }
      }
      finish(ok, xhr.status === 403 ? "Not paired — scan again" : (xhr.responseText || "Failed").slice(0, 60));
    };
    xhr.onerror = () => finish(false, "Connection lost");
    xhr.send(u.file);
    renderUploads();
  }

  // Files picked or shared together go as one batch, so Briefcast keeps them together, in order.
  function queue(files, target, share) {
    const batch = Math.random().toString(36).slice(2, 10);
    for (const file of files) uploads.push({ file, state: "waiting", sent: 0, target, batch, share });
    renderUploads();
    pump();
  }
  $("pick").addEventListener("change", (e) => { queue([...e.target.files], "library"); e.target.value = ""; });
  $("pick-tl").addEventListener("change", (e) => { queue([...e.target.files], "timeline"); e.target.value = ""; });

  // Briefcast's word on a timeline file: on the timeline, or (with why) kept in the library.
  function applyPlaced(id, placed, note) {
    const u = uploads.find((x) => x.id === id);
    if (!u) { earlyPlaced.set(id, { placed, note }); return; }
    u.placed = placed; u.note = note || "";
    renderUploads();
    batchSettled(u.batch);
  }

  // One announcement per batch, once every file in it has an answer.
  function batchSettled(batch) {
    const files = uploads.filter((x) => x.batch === batch && x.target === "timeline");
    if (!files.length || files.some((x) => x.state === "waiting" || x.state === "sending" || (x.state === "done" && x.placed === undefined))) return;
    if (files.some((x) => x.announced)) return;
    files.forEach((x) => (x.announced = true));
    const on = files.filter((x) => x.placed === true).length;
    const kept = files.find((x) => x.placed === false);
    if (on) {
      toast(on === 1 ? "✓ Added to your timeline" : `✓ ${on} added to your timeline`);
      if (navigator.vibrate) navigator.vibrate([18, 70, 18]);
    } else if (kept) toast(kept.note || `Saved to ${host}'s library`);
  }

  // The editor opened a video, or closed it.
  function setTimeline(name) {
    timeline = name || null;
    $("timeline").hidden = !timeline;
    $("add-tl").hidden = !timeline;
    $("tl-name").textContent = timeline || "";
    $("send-lib").className = timeline ? "btn second" : "btn primary";
    $("send-lib").textContent = timeline ? "Send to library" : `Send to ${host}`;
    renderShare();
  }

  // ---- Android's share sheet -> sw.js -> IndexedDB -> here. A share stays stored until it's
  // been sent (or discarded), so one made while the computer is asleep is still waiting later.
  let shares = [];
  let shareInfo = null;
  let shareGridKey = "";
  let shareUrls = [];
  const shareDb = () => new Promise((resolve, reject) => {
    const req = indexedDB.open("briefcast-transfer", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("shares", { keyPath: "id", autoIncrement: true });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  const shareTx = async (mode, run) => {
    const db = await shareDb();
    try {
      return await new Promise((resolve, reject) => {
        const tx = db.transaction("shares", mode);
        const req = run(tx.objectStore("shares"));
        tx.oncomplete = () => resolve(req && req.result);
        tx.onerror = () => reject(tx.error);
      });
    } finally { db.close(); }
  };
  async function loadShares() {
    if (!window.isSecureContext || !("indexedDB" in window)) return;
    try { shares = (await shareTx("readonly", (st) => st.getAll())) || []; } catch (_) { shares = []; }
    // A share with no files is shown once - for the share that just opened the app - and never
    // kept: there's nothing to send later.
    const current = /^\d+$/.test(shareParam || "") ? Number(shareParam) : null;
    for (const x of shares.filter((y) => !y.files.length)) dropShare(x.id);
    shares = shares.filter((y) => y.files.length || y.id === current);
    renderShare();
  }
  const dropShare = (id) => shareTx("readwrite", (st) => st.delete(id)).catch(() => {});

  // A shared file finished (or failed). Once all of a share's files have, it's forgotten - except
  // the ones that failed, which come back on the card to try again.
  function shareSettled(u) {
    const s = u.share;
    if (u.state === "failed") s.failed.push(u.file);
    if (--s.left > 0) return;
    s.queued = false;
    if (!s.failed.length) {
      shares = shares.filter((x) => x !== s);
      dropShare(s.id);
    } else {
      s.files = s.failed;
      shareTx("readwrite", (st) => st.put({ id: s.id, at: s.at, files: s.files, text: s.text })).catch(() => {});
      toast(s.files.length === 1 ? "1 file didn't send — try again" : `${s.files.length} files didn't send — try again`);
    }
    renderShare();
  }

  function sendShares(target) {
    for (const s of shares.filter((x) => !x.queued && x.files.length)) {
      s.queued = true; s.left = s.files.length; s.failed = [];
      const media = s.files.filter(isMedia), other = s.files.filter((f) => !isMedia(f));
      if (target === "timeline") {
        if (media.length) queue(media, "timeline", s);
        if (other.length) queue(other, "library", s);
      } else queue(s.files, "library", s);
    }
    shareInfo = null;
    renderShare();
    $("sender").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function shareTile(file) {
    const tile = document.createElement("div"); tile.className = "tile";
    const url = URL.createObjectURL(file); shareUrls.push(url);
    if (/^image\//.test(file.type) && !/heic|heif/i.test(file.type)) {
      const img = document.createElement("img"); img.alt = ""; img.src = url; tile.appendChild(img);
    } else if (/^video\//.test(file.type)) {
      // A muted, unplayed <video> shows its first frame; its length goes in the corner.
      const v = document.createElement("video");
      v.muted = true; v.playsInline = true; v.preload = "metadata"; v.src = url + "#t=0.1";
      v.addEventListener("loadedmetadata", () => {
        if (!isFinite(v.duration)) return;
        const b = document.createElement("span"); b.className = "badge";
        const d = Math.round(v.duration);
        b.textContent = `${Math.floor(d / 60)}:${String(d % 60).padStart(2, "0")}`;
        tile.appendChild(b);
      });
      tile.appendChild(v);
    } else {
      tile.textContent = /^audio\//.test(file.type) ? "♪" : (file.name.split(".").pop() || "FILE").slice(0, 4).toUpperCase();
    }
    return tile;
  }

  function renderShare() {
    const box = $("share");
    const pending = shares.filter((x) => !x.queued);
    const files = pending.flatMap((x) => x.files);
    $("sender").classList.toggle("quiet", files.length > 0);
    if (!pending.length && !shareInfo) { box.hidden = true; return; }
    box.hidden = false;
    const grid = $("share-grid");
    if (!files.length) {
      const texts = pending.map((x) => x.text).filter(Boolean);
      const fields = [...new Set(pending.flatMap((x) => x.fields || []))];
      const info = shareInfo || {
        title: "Nothing to send",
        body: (texts.length
          ? "No file came with that share, only a link or text — Briefcast moves photos, videos and files."
          : "No file came with that share. Please share it again.") + (fields.length ? ` It brought: ${fields.join("; ")}.` : ""),
      };
      $("share-title").textContent = info.title;
      $("share-meta").textContent = info.body;
      grid.hidden = true; $("share-tl").hidden = true; $("share-lib").hidden = true;
      return;
    }
    grid.hidden = false; $("share-lib").hidden = false;
    const key = pending.map((x) => x.id + ":" + x.files.length).join(",");
    if (key !== shareGridKey) {
      shareGridKey = key;
      shareUrls.forEach((u) => URL.revokeObjectURL(u)); shareUrls = [];
      grid.innerHTML = "";
      const shown = files.length > 8 ? 7 : 8;
      files.slice(0, shown).forEach((f) => grid.appendChild(shareTile(f)));
      if (files.length > shown) {
        const more = document.createElement("div"); more.className = "tile more"; more.textContent = `+${files.length - shown}`;
        grid.appendChild(more);
      }
    }
    const total = files.reduce((n, f) => n + f.size, 0);
    const media = files.filter(isMedia).length;
    $("share-title").textContent = files.length === 1 ? "1 file to send" : `${files.length} files to send`;
    $("share-meta").textContent = !creds
      ? `${fmtSize(total)} · connect this phone to Briefcast first — they'll wait here.`
      : welcomed ? fmtSize(total) : `${fmtSize(total)} · waiting for ${host}…`;
    const tl = $("share-tl"), lib = $("share-lib");
    tl.hidden = !(timeline && media);
    tl.textContent = media === files.length ? `Add to timeline · ${timeline || ""}` : `Add ${media} to timeline · ${timeline || ""}`;
    lib.className = tl.hidden ? "btn primary" : "btn";
    lib.textContent = tl.hidden ? `Send to ${host}` : "Send to library";
    tl.disabled = lib.disabled = !welcomed;
  }

  $("share-tl").addEventListener("click", () => sendShares("timeline"));
  $("share-lib").addEventListener("click", () => sendShares("library"));
  $("share-discard").addEventListener("click", () => {
    for (const x of shares.filter((y) => !y.queued)) dropShare(x.id);
    shares = shares.filter((y) => y.queued);
    shareInfo = null;
    renderShare();
  });
  if (shareParam === "unavailable") shareInfo = { title: "Install Briefcast to share to it", body: "Sharing straight from your gallery works in the installed app. Tap Install on this page, then share again." };
  else if (shareParam === "failed") shareInfo = { title: "That share didn't come through", body: "Please share it again." };

  function render() {
    const list = $("list");
    list.innerHTML = "";
    const items = [...offers.values()].sort((a, b) => b.order - a.order);
    $("received-title").hidden = !items.length;
    if (!items.length) {
      list.innerHTML = welcomed
        ? `<div class="empty">Files you send from Briefcast (<b>Transfer to phone</b>) land here.</div>`
        : "";
      return;
    }
    for (const o of items) {
      const kind = (o.mime || "").split("/")[0];
      const el = document.createElement("div");
      el.className = "item" + (o.state !== "done" && !o.started ? " new" : "");
      const thumb = document.createElement("div");
      thumb.className = "thumb";
      if (kind === "image" && !/heic|heif/.test(o.mime)) {
        const img = document.createElement("img");
        img.loading = "lazy"; img.alt = ""; img.src = fileUrl(o.id, true);
        thumb.appendChild(img);
      } else {
        thumb.textContent = (o.name.split(".").pop() || "FILE").slice(0, 4).toUpperCase();
      }
      const info = document.createElement("div");
      const name = document.createElement("div"); name.className = "name"; name.textContent = o.name;
      const meta = document.createElement("div"); meta.className = "meta";
      const stateText = o.state === "done" ? `<span class="ok">✓ Downloaded</span>`
        : o.state === "interrupted" ? `<span class="bad">Stopped — tap Save to retry</span>`
        : o.started ? "Downloading…" : "Ready";
      meta.innerHTML = `${fmtSize(o.size)} · ${stateText}${o.at ? ` · <span class="when"></span>` : ""}`;
      if (o.at) meta.querySelector(".when").textContent = fmtWhen(o.at);
      info.append(name, meta);

      const actions = document.createElement("div"); actions.className = "actions";
      const save = document.createElement("a");
      save.className = "btn primary"; save.href = fileUrl(o.id, false); save.download = o.name;
      save.innerHTML = "<span></span>";
      save.firstChild.textContent = o.state === "done" ? "Save again" : "Save";
      save.addEventListener("click", () => { o.started = true; setTimeout(render, 0); });
      actions.appendChild(save);
      if (["image", "video", "audio"].includes(kind) || o.mime === "application/pdf") {
        const open = document.createElement("a");
        open.className = "btn"; open.href = fileUrl(o.id, true); open.target = "_blank"; open.rel = "noopener";
        open.innerHTML = "<span>Open</span>";
        actions.appendChild(open);
      }
      if (canShareFile(o)) {
        actions.classList.add(actions.children.length === 2 ? "three" : "two");
        const share = document.createElement("button");
        share.type = "button";
        share.className = "btn sharebtn" + (o.shareReady ? " ready" : "");
        share.dataset.offer = o.id;
        share.setAttribute("aria-label", `Share ${o.name}`);
        share.innerHTML = `<i class="fill"></i><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg><span></span>`;
        share.addEventListener("click", () => shareOffer(o));
        actions.appendChild(share);
        paintShare(o, share);
      }
      el.append(thumb, info, actions);
      // iOS saves downloads to Files, not Photos - say how to get a picture or video into Photos.
      if (isIOS && (kind === "image" || kind === "video")) {
        const hint = document.createElement("div"); hint.className = "hint";
        hint.textContent = kind === "image"
          ? "Tip: tap Open, then press and hold the picture to save it to Photos."
          : "Tip: Save puts it in Files › Downloads. To add it to Photos, open it there and tap Share › Save Video.";
        el.appendChild(hint);
      }
      list.appendChild(el);
    }
  }

  // ---- Received files straight on to TikTok, Instagram, YouTube, WhatsApp... - the phone's own
  // share sheet, which lists whatever the person has installed. The sheet needs the file itself, so
  // it's fetched into the page first (showing progress on the button). A big one can take longer
  // than a tap's permission to open the sheet lasts; then the button waits, ready: "Tap to share".
  function canShareFile(o) {
    if (!navigator.canShare || !navigator.share) return false;
    try { return navigator.canShare({ files: [new File([""], o.name, { type: o.mime || "" })] }); } catch (_) { return false; }
  }
  function paintShare(o, el) {
    el = el || document.querySelector(`.btn.sharebtn[data-offer="${CSS.escape(o.id)}"]`);
    if (!el) return;
    el.querySelector(".fill").style.width = o.sharing ? `${o.sharePct || 0}%` : "0";
    el.querySelector("span").textContent = o.sharing ? `${o.sharePct || 0}%` : o.shareReady ? "Tap to share" : "Share";
    el.classList.toggle("ready", !!o.shareReady);
  }
  async function openShareSheet(o) {
    try {
      await navigator.share({ files: [o.shareFile], title: o.name });
      o.shareReady = false;
    } catch (e) {
      // NotAllowedError: the fetch outlasted the tap - the next tap opens the sheet at once.
      if (e && e.name === "NotAllowedError") o.shareReady = true;
      else if (!e || e.name !== "AbortError") toast("This file can't be shared from here");
    }
    paintShare(o);
  }
  async function shareOffer(o) {
    if (o.sharing) return;
    if (o.shareFile) return openShareSheet(o);
    o.sharing = true; o.sharePct = 0; paintShare(o);
    try {
      const res = await fetch(fileUrl(o.id, true));
      if (!res.ok || !res.body) throw new Error(String(res.status));
      const reader = res.body.getReader();
      const chunks = []; let got = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value); got += value.length;
        o.sharePct = o.size ? Math.min(99, Math.floor((got / o.size) * 100)) : 0;
        paintShare(o);
      }
      o.shareFile = new File(chunks, o.name, { type: o.mime || "application/octet-stream" });
    } catch (_) {
      o.sharing = false; paintShare(o);
      toast("Couldn't get the file ready — is Briefcast still open?");
      return;
    }
    o.sharing = false; paintShare(o);
    openShareSheet(o);
  }

  function scheduleReconnect() {
    if (stopped) return;
    clearTimeout(retryTimer);
    const delay = Math.min(1000 * Math.pow(1.6, attempt++), 8000);
    retryTimer = setTimeout(connect, delay);
  }

  // Drops a socket without waiting for its close handshake - one that went quiet while the phone
  // slept can take minutes to report itself closed.
  function abandon(socket) {
    socket.onclose = socket.onmessage = null;
    try { socket.close(); } catch (_) {}
    if (ws === socket) ws = null;
    clearInterval(pingTimer);
  }

  // The reconnect button, coming back to the page, the network returning: try now, not whenever
  // the backoff says. A socket that hasn't been heard from since before the phone slept is dead
  // in all but name, so it's replaced rather than trusted.
  function reconnectNow() {
    stopped = false; attempt = 0;
    if (ws && (ws.readyState !== 1 || !welcomed || Date.now() - lastHeard > 12000)) abandon(ws);
    connect();
  }

  function unpaired() {
    setStatus("Not connected", "");
    $("me").hidden = true; $("sender").hidden = true; $("install").hidden = true;
  }

  function forgotten(title, body) {
    creds = null; saveCreds(); offers.clear(); render();
    unpaired();
    notice(title, body);
  }

  function connect() {
    if (stopped) return;
    if (ws && ws.readyState <= 1) return;
    clearTimeout(retryTimer);
    if (!creds && !pairKey) {
      unpaired();
      notice("Scan the code in Briefcast", "On your computer, choose Transfer to phone › Connect another phone and scan the QR code it shows with this phone's camera.");
      return;
    }
    welcomed = false;
    const p = new URLSearchParams();
    if (creds) { p.set("d", creds.d); p.set("t", creds.t); }
    if (pairKey) p.set("k", pairKey);
    p.set("n", (creds && creds.name) || defaultName);
    setStatus(creds ? "Reconnecting…" : "Connecting…", "wait");
    const socket = new WebSocket(`${secure ? "wss" : "ws"}://${location.host}/ws?${p}`);
    ws = socket;

    socket.onmessage = (ev) => {
      lastHeard = Date.now();
      let m; try { m = JSON.parse(ev.data); } catch (_) { return; }
      if (m.type === "welcome") {
        welcomed = true; attempt = 0; pairKey = "";
        creds = { d: m.device.id, t: m.device.token, name: m.device.name, host: m.host };
        saveCreds();
        setStatus(`Connected to ${m.host}${secure ? " · 🔒 encrypted" : ""}`, "on");
        $("me").hidden = false; $("me").textContent = m.device.name + " ✎";
        $("sender").hidden = false;
        host = m.host;
        setTimeline(m.timeline);
        notice("", "");
        // Unencrypted is allowed (the desktop offers it only on purpose) but never invisible.
        $("security").innerHTML = secure ? "" : `<div class="warn"><b>Unencrypted connection.</b> Anyone on this network could see the files you send or receive here.</div>`;
        render();
        showInstall();
        // Briefcast answers every ping. Silence means the connection died without a close (Wi-Fi
        // dropped, the computer slept) - the page would otherwise say "Connected" forever.
        clearInterval(pingTimer);
        pingTimer = setInterval(() => {
          if (Date.now() - lastHeard > 25000) {
            abandon(socket);
            setStatus("Reconnecting…", "wait");
            attempt = 0; connect();
          } else if (socket.readyState === 1) socket.send('{"type":"ping"}');
        }, 10000);
      } else if (m.type === "confirm") {
        // A new phone isn't trusted until someone at the computer approves it.
        setStatus("Waiting for approval…", "wait");
        $("notice").innerHTML = `<div class="notice"><h2>Approve this phone on your computer</h2><div class="code"></div><p>Briefcast on your computer shows the same code. Check it matches, then approve it there. Keep this page open.</p></div>`;
        $("notice").querySelector(".code").textContent = m.code;
      } else if (m.type === "denied") {
        stopped = true; pairKey = "";
        setStatus("Not connected", "");
        notice("Not approved", "This phone wasn't approved on the computer (or nobody answered in time). To try again, scan a new QR code from Briefcast.");
      } else if (m.type === "offer") {
        const existing = offers.get(m.id);
        const offer = existing || { id: m.id, order: offers.size, started: false };
        Object.assign(offer, { name: m.name, size: m.size, mime: m.mime, state: m.state, at: m.at || offer.at || Date.now() });
        offers.set(m.id, offer);
        render();
        if (m.fresh && !existing) {
          toast(`Receiving ${m.name}`);
          if (navigator.vibrate) navigator.vibrate(30);
          download(offer);
        }
      } else if (m.type === "status") {
        const o = offers.get(m.id);
        if (o) { o.state = m.state; render(); if (m.state === "done") toast(`✓ ${o.name}`); }
      } else if (m.type === "context") {
        setTimeline(m.timeline);
      } else if (m.type === "placed") {
        applyPlaced(m.id, !!m.placed, m.note);
      } else if (m.type === "renamed") {
        creds.name = m.name; saveCreds(); $("me").textContent = m.name + " ✎";
      } else if (m.type === "replaced") {
        stopped = true;
        setStatus("Open somewhere else", "");
        notice("Briefcast is open in another tab", "This phone is now receiving files there. Tap ⟳ to use it here instead.");
      } else if (m.type === "forget") {
        stopped = true;
        forgotten("This phone was removed", "It was disconnected from Briefcast on the computer. Scan the QR code again to reconnect.");
      }
    };

    socket.onclose = () => lost(socket);
  }

  async function lost(socket) {
    clearInterval(pingTimer);
    if (ws !== socket) return;
    ws = null;
    if (stopped) return;
    if (welcomed) { setStatus("Reconnecting…", "wait"); scheduleReconnect(); return; }
    // Closed before we were welcomed. A WebSocket close can't say why, so ask: only a definite
    // "not paired" from Briefcast makes this phone forget its pairing - never a guess.
    if (creds) {
      let res = null;
      try { res = await fetch(`/hello?d=${encodeURIComponent(creds.d)}&t=${encodeURIComponent(creds.t)}`, { cache: "no-store" }); } catch (_) {}
      if (ws || stopped) return;
      if (res && res.status === 401) {
        forgotten("This phone was removed", "Briefcast on the computer no longer knows this phone. Scan the QR code again to reconnect.");
        return;
      }
      if (!res) {
        setStatus("Waiting for Briefcast…", "wait");
        notice("Can't reach your computer", "Make sure Briefcast is open and this phone is on the same Wi-Fi. It reconnects on its own, or tap ⟳.");
      } else setStatus("Reconnecting…", "wait");
      scheduleReconnect();
      return;
    }
    // Pairing with a QR code's key, which works once and expires.
    let reachable = false;
    try { reachable = (await fetch("/ping", { cache: "no-store" })).ok; } catch (_) {}
    if (ws || stopped) return;
    if (reachable) {
      pairKey = "";
      unpaired();
      notice("Scan the code again", "That code has already been used or has expired. In Briefcast, choose Transfer to phone › Connect another phone and scan the new one.");
    } else {
      setStatus("Waiting for Briefcast…", "wait");
      notice("Can't reach your computer", "Make sure Briefcast is open and this phone is on the same Wi-Fi.");
      scheduleReconnect();
    }
  }

  // Home screen. Over HTTPS the browser offers a real install (no address bar, its own icon and
  // window); over HTTP the best Android does is a shortcut that opens this page in Chrome.
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const INSTALL_DISMISSED = STORE + "-install-dismissed";
  let installPrompt = null;
  const installDismissed = () => { try { return !!localStorage.getItem(INSTALL_DISMISSED); } catch (_) { return false; } };

  function showInstall() {
    const box = $("install");
    if (standalone || !welcomed || installDismissed() || (!installPrompt && !/Android/.test(ua))) { box.hidden = true; return; }
    $("install-title").textContent = "Add Briefcast to your home screen";
    $("install-body").textContent = installPrompt
      ? "It opens like an app — no browser bar — and reconnects to your computer by itself."
      : "This card can't add it for you. In Chrome's ⋮ menu (top right) tap Install and create shortcut › Create shortcut (older Chrome: Add to Home screen), then confirm. The icon may land on a later home-screen page.";
    $("install-go").textContent = installPrompt ? "Install" : "OK";
    box.hidden = false;
  }

  $("install-go").addEventListener("click", async () => {
    if (installPrompt) {
      const prompt = installPrompt; installPrompt = null;
      prompt.prompt();
      try { await prompt.userChoice; } catch (_) {}
      showInstall();
    } else $("install-later").click();
  });
  $("install-later").addEventListener("click", () => {
    try { localStorage.setItem(INSTALL_DISMISSED, "1"); } catch (_) {}
    $("install").hidden = true;
  });
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installPrompt = e; showInstall(); });
  window.addEventListener("appinstalled", () => { $("install").hidden = true; toast("Added — open Briefcast from your home screen"); });
  if (window.isSecureContext && "serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});

  $("retry").addEventListener("click", reconnectNow);

  $("me").addEventListener("click", () => {
    const name = prompt("Name this phone (shown in Briefcast):", (creds && creds.name) || defaultName);
    if (name && name.trim() && ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "rename", name: name.trim() }));
  });

  // Mobile browsers drop the socket whenever the page is hidden; come back the moment it's visible.
  // (Not when another tab took over - that one keeps it until ⟳ is tapped here.)
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && !stopped) reconnectNow();
  });
  // Restored from the back/forward cache: the old socket is gone even though the page isn't.
  window.addEventListener("pageshow", (e) => { if (e.persisted && !stopped) reconnectNow(); });
  window.addEventListener("online", () => { if (!stopped) reconnectNow(); });

  // Moves onto this computer's trusted HTTPS name if the phone can actually reach it. Bounded by a
  // short timeout: a router that blocks the name, or no internet to resolve it, must not hold up
  // a transfer that works fine over HTTP.
  async function upgradeToHttps() {
    if (secure) return false;
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 3500);
    try {
      const target = await fetch("/tls", { cache: "no-store", signal: ctl.signal });
      if (!target.ok) return false;
      const { https } = await target.json();
      const probe = await fetch(`${https}/ping`, { cache: "no-store", mode: "cors", signal: ctl.signal });
      if (!probe.ok) return false;
      const p = new URLSearchParams();
      if (pairKey) p.set("k", pairKey);
      if (creds) { p.set("d", creds.d); p.set("t", creds.t); if (creds.name) p.set("n", creds.name); }
      const hash = p.toString();
      location.replace(`${https}/${hash ? "#" + hash : ""}`);
      return true;
    } catch (_) {
      return false;
    } finally {
      clearTimeout(timer);
    }
  }

  setStatus("Connecting…", "wait");
  loadShares();
  upgradeToHttps().then((moved) => { if (!moved) connect(); });
})();
</script>
</body>
</html>
