<!doctype html>
<!--
  The phone side of "Transfer to phone" - served by src-tauri/src/services/phone_transfer.rs.

  Pairs once (the QR's #k= key), then keeps a device id + token in localStorage so every later visit
  reconnects by itself. Files Briefcast sends arrive as offers over the WebSocket and are downloaded
  straight from /f/<offer>; "Send to computer" streams the phone's own files up to /u, one at a time.

  Opened over HTTP (what the QR code always points at, because it works on any network), the page
  first asks for this computer's trusted HTTPS name (/tls), checks it really connects from here, and
  if so moves itself there - see lan_tls.rs. Otherwise it simply carries on over HTTP. Self-contained on purpose: no fonts, scripts or icons from the internet,
  since the phone may be on a hotspot with no connection beyond this computer.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0b0b0c">
<title>Briefcast Transfer</title>
<style>
  :root {
    --bg: #f5f5f4; --card: #ffffff; --text: #171717; --muted: #737373; --line: #e5e5e5;
    --accent: #2563eb; --accent-text: #ffffff; --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0b0c; --card: #171717; --text: #f5f5f5; --muted: #a3a3a3; --line: #262626;
      --accent: #3b82f6; --ok: #22c55e; --warn: #f59e0b; --bad: #f87171; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 28px); }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .logo { width: 34px; height: 34px; border-radius: 9px; background: var(--text); color: var(--bg);
    display: grid; place-items: center; font-weight: 700; font-size: 17px; }
  h1 { font-size: 17px; margin: 0; }
  .sub { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); } .dot.wait { background: var(--warn); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .me { margin-left: auto; font-size: 13px; color: var(--muted); background: none; border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 11px; color: var(--text); }
  .notice { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .notice h2 { font-size: 15px; margin: 0 0 4px; }
  .notice p { margin: 0; color: var(--muted); font-size: 14px; }
  .code { font: 700 44px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .18em; text-align: center; margin: 14px 0 6px; }
  .warn { border: 1px solid var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
  .warn b { color: var(--warn); }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px;
    display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; }
  .item.new { border-color: var(--accent); }
  .thumb { width: 56px; height: 56px; border-radius: 10px; background: var(--line); overflow: hidden;
    display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .name { font-weight: 600; word-break: break-word; }
  .meta { font-size: 13px; color: var(--muted); }
  .meta .ok { color: var(--ok); } .meta .bad { color: var(--bad); }
  .actions { grid-column: 1 / -1; display: flex; gap: 8px; }
  .btn { flex: 1; text-align: center; text-decoration: none; border-radius: 10px; padding: 11px 12px; font-weight: 600;
    font-size: 15px; border: 1px solid var(--line); color: var(--text); background: transparent; }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  .hint { font-size: 12.5px; color: var(--muted); grid-column: 1 / -1; margin-top: -2px; }
  .empty { text-align: center; color: var(--muted); padding: 48px 12px; }
  .empty .big { font-size: 40px; margin-bottom: 6px; }
  .sender { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 16px; }
  .sender .btn { display: block; width: 100%; }
  .sender .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; font-size: 13px; }
  .sender .row .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 4px; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .15s; }
  .section { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 4px 2px 8px; }
  footer { margin-top: 22px; font-size: 12.5px; color: var(--muted); text-align: center; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 18px); transform: translate(-50%, 20px);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px;
    opacity: 0; transition: .2s; pointer-events: none; max-width: 90vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<main>
  <header>
    <div class="logo">B</div>
    <div>
      <h1>Briefcast Transfer</h1>
      <div class="sub"><span id="dot" class="dot wait"></span><span id="status">Connecting…</span></div>
    </div>
    <button id="me" class="me" hidden></button>
  </header>
  <div id="security"></div>
  <div id="notice"></div>
  <div id="sender" class="sender" hidden>
    <label class="btn primary" for="pick">Send to computer</label>
    <input id="pick" type="file" multiple hidden>
    <div id="uploads"></div>
  </div>
  <div id="received-title" class="section" hidden>Received</div>
  <div id="list" class="list"></div>
  <footer id="footer">Keep this page open (or bookmark it) to move files either way. Everything travels over your Wi-Fi in full original quality — no mobile data, no upload to the internet.</footer>
</main>
<div id="toast" class="toast"></div>
<script>
(() => {
  const STORE = "briefcast-transfer";
  const $ = (id) => document.getElementById(id);
  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);

  let creds = null;
  try { creds = JSON.parse(localStorage.getItem(STORE) || "null"); } catch (_) {}
  const saveCreds = () => { try { creds ? localStorage.setItem(STORE, JSON.stringify(creds)) : localStorage.removeItem(STORE); } catch (_) {} };

  // The pairing key only rides in the fragment, which is never sent to the server; strip it so a
  // bookmark of this page is just the address.
  const fragment = new URLSearchParams(location.hash.slice(1));
  let pairKey = fragment.get("k") || "";
  // Handed over by the HTTP page when it moved us onto HTTPS - localStorage is per origin, so
  // without this the phone would have to pair all over again.
  if (fragment.get("d") && fragment.get("t")) {
    creds = { d: fragment.get("d"), t: fragment.get("t"), name: fragment.get("n") || undefined };
    saveCreds();
  }
  if (location.hash) history.replaceState(null, "", location.pathname);
  const secure = location.protocol === "https:";

  const defaultName = /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) ? "iPad" : /Android/.test(ua) ? "Android phone" : "Phone";
  const offers = new Map();
  // Phone -> computer: one upload at a time - the Wi-Fi link is the bottleneck, so parallel
  // uploads would only make every file finish later.
  const uploads = [];
  let uploading = false;
  let ws = null, welcomed = false, stopped = false, retryTimer = 0, pingTimer = 0, attempt = 0;

  const setStatus = (text, kind) => { $("status").textContent = text; $("dot").className = "dot " + (kind || ""); };
  const toast = (text) => {
    const t = $("toast"); t.textContent = text; t.classList.add("show");
    clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 2600);
  };
  const notice = (title, body) => {
    $("notice").innerHTML = title ? `<div class="notice"><h2></h2><p></p></div>` : "";
    if (title) { $("notice").querySelector("h2").textContent = title; $("notice").querySelector("p").textContent = body; }
  };
  const fmtSize = (n) => {
    if (n < 1024) return n + " B";
    const u = ["KB", "MB", "GB", "TB"]; let i = -1;
    do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
    return n.toFixed(n < 10 ? 1 : 0) + " " + u[i];
  };
  const fileUrl = (id, inline) =>
    `/f/${encodeURIComponent(id)}?d=${encodeURIComponent(creds.d)}&t=${encodeURIComponent(creds.t)}${inline ? "&inline=1" : ""}`;

  const download = (offer) => {
    const a = document.createElement("a");
    a.href = fileUrl(offer.id, false);
    a.download = offer.name;
    document.body.appendChild(a); a.click(); a.remove();
    offer.started = true;
    render();
  };

  function renderUploads() {
    const box = $("uploads");
    box.innerHTML = "";
    for (const u of uploads.slice(-6).reverse()) {
      const row = document.createElement("div");
      const top = document.createElement("div"); top.className = "row";
      const n = document.createElement("span"); n.className = "n"; n.textContent = u.file.name;
      const st = document.createElement("span");
      if (u.state === "done") { st.className = "ok"; st.style.color = "var(--ok)"; st.textContent = "✓ Sent"; }
      else if (u.state === "failed") { st.style.color = "var(--bad)"; st.textContent = u.error || "Failed"; }
      else if (u.state === "sending") {
        const pct = u.file.size ? Math.floor((u.sent / u.file.size) * 100) : 0;
        st.textContent = `${pct}%${u.speed ? " · " + fmtSize(u.speed) + "/s" : ""}`;
      } else st.textContent = "Waiting…";
      top.append(n, st);
      row.appendChild(top);
      if (u.state === "sending") {
        const bar = document.createElement("div"); bar.className = "bar";
        const fill = document.createElement("i");
        fill.style.width = (u.file.size ? (u.sent / u.file.size) * 100 : 0) + "%";
        bar.appendChild(fill); row.appendChild(bar);
      }
      box.appendChild(row);
    }
  }

  function pump() {
    if (uploading || !creds) return;
    const u = uploads.find((x) => x.state === "waiting");
    if (!u) return;
    uploading = true;
    u.state = "sending"; u.sent = 0; u.speed = 0;
    const started = Date.now();
    const xhr = new XMLHttpRequest();
    const q = new URLSearchParams({ d: creds.d, t: creds.t, name: u.file.name, size: String(u.file.size) });
    xhr.open("POST", `/u?${q}`);
    // XHR rather than fetch: only XHR reports upload progress. A File body is streamed from
    // storage by the browser, never read into memory whole.
    xhr.upload.onprogress = (e) => {
      u.sent = e.loaded;
      const secs = (Date.now() - started) / 1000;
      u.speed = secs > 0.5 ? e.loaded / secs : 0;
      renderUploads();
    };
    const finish = (ok, error) => {
      u.state = ok ? "done" : "failed"; u.error = error;
      uploading = false;
      if (ok && navigator.vibrate) navigator.vibrate(20);
      renderUploads();
      if (!uploads.some((x) => x.state === "waiting")) {
        const done = uploads.filter((x) => x.state === "done" && !x.toasted);
        done.forEach((x) => (x.toasted = true));
        if (done.length) toast(done.length === 1 ? `✓ Sent ${done[0].file.name}` : `✓ Sent ${done.length} files`);
      }
      pump();
    };
    xhr.onload = () => finish(xhr.status >= 200 && xhr.status < 300, xhr.status === 403 ? "Not paired — scan again" : (xhr.responseText || "Failed").slice(0, 60));
    xhr.onerror = () => finish(false, "Connection lost");
    xhr.send(u.file);
    renderUploads();
  }

  $("pick").addEventListener("change", (e) => {
    for (const file of e.target.files) uploads.push({ file, state: "waiting", sent: 0 });
    e.target.value = "";
    renderUploads();
    pump();
  });

  function render() {
    const list = $("list");
    list.innerHTML = "";
    const items = [...offers.values()].sort((a, b) => b.order - a.order);
    $("received-title").hidden = !items.length;
    if (!items.length) {
      list.innerHTML = welcomed
        ? `<div class="empty">Files you send from Briefcast (<b>Transfer to phone</b>) land here.</div>`
        : "";
      return;
    }
    for (const o of items) {
      const kind = (o.mime || "").split("/")[0];
      const el = document.createElement("div");
      el.className = "item" + (o.state !== "done" && !o.started ? " new" : "");
      const thumb = document.createElement("div");
      thumb.className = "thumb";
      if (kind === "image" && !/heic|heif/.test(o.mime)) {
        const img = document.createElement("img");
        img.loading = "lazy"; img.alt = ""; img.src = fileUrl(o.id, true);
        thumb.appendChild(img);
      } else {
        thumb.textContent = (o.name.split(".").pop() || "FILE").slice(0, 4).toUpperCase();
      }
      const info = document.createElement("div");
      const name = document.createElement("div"); name.className = "name"; name.textContent = o.name;
      const meta = document.createElement("div"); meta.className = "meta";
      const stateText = o.state === "done" ? `<span class="ok">✓ Downloaded</span>`
        : o.state === "interrupted" ? `<span class="bad">Stopped — tap Save to retry</span>`
        : o.started ? "Downloading…" : "Ready";
      meta.innerHTML = `${fmtSize(o.size)} · ${stateText}`;
      info.append(name, meta);

      const actions = document.createElement("div"); actions.className = "actions";
      const save = document.createElement("a");
      save.className = "btn primary"; save.href = fileUrl(o.id, false); save.download = o.name;
      save.textContent = o.state === "done" ? "Save again" : "Save";
      save.addEventListener("click", () => { o.started = true; setTimeout(render, 0); });
      actions.appendChild(save);
      if (["image", "video", "audio"].includes(kind) || o.mime === "application/pdf") {
        const open = document.createElement("a");
        open.className = "btn"; open.href = fileUrl(o.id, true); open.target = "_blank"; open.rel = "noopener";
        open.textContent = "Open";
        actions.appendChild(open);
      }
      el.append(thumb, info, actions);
      // iOS saves downloads to Files, not Photos - say how to get a picture or video into Photos.
      if (isIOS && (kind === "image" || kind === "video")) {
        const hint = document.createElement("div"); hint.className = "hint";
        hint.textContent = kind === "image"
          ? "Tip: tap Open, then press and hold the picture to save it to Photos."
          : "Tip: Save puts it in Files › Downloads. To add it to Photos, open it there and tap Share › Save Video.";
        el.appendChild(hint);
      }
      list.appendChild(el);
    }
  }

  function scheduleReconnect() {
    if (stopped) return;
    clearTimeout(retryTimer);
    const delay = Math.min(1000 * Math.pow(1.6, attempt++), 8000);
    retryTimer = setTimeout(connect, delay);
  }

  function connect() {
    if (stopped) return;
    if (ws && ws.readyState <= 1) return;
    if (!creds && !pairKey) {
      setStatus("Not connected", "");
      notice("Scan the code in Briefcast", "On your computer, choose Transfer to phone on any file and scan the QR code it shows to connect this phone.");
      return;
    }
    clearTimeout(retryTimer);
    welcomed = false;
    const p = new URLSearchParams();
    if (creds) { p.set("d", creds.d); p.set("t", creds.t); }
    if (pairKey) p.set("k", pairKey);
    p.set("n", (creds && creds.name) || defaultName);
    setStatus(creds ? "Reconnecting…" : "Connecting…", "wait");
    const socket = new WebSocket(`${secure ? "wss" : "ws"}://${location.host}/ws?${p}`);
    ws = socket;

    socket.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch (_) { return; }
      if (m.type === "welcome") {
        welcomed = true; attempt = 0; pairKey = "";
        creds = { d: m.device.id, t: m.device.token, name: m.device.name, host: m.host };
        saveCreds();
        setStatus(`Connected to ${m.host}${secure ? " · 🔒 encrypted" : ""}`, "on");
        $("me").hidden = false; $("me").textContent = m.device.name + " ✎";
        $("sender").hidden = false;
        $("sender").querySelector("label").textContent = `Send to ${m.host}`;
        notice("", "");
        // Unencrypted is allowed (the desktop offers it only on purpose) but never invisible.
        $("security").innerHTML = secure ? "" : `<div class="warn"><b>Unencrypted connection.</b> Anyone on this network could see the files you send or receive here.</div>`;
        render();
        clearInterval(pingTimer);
        pingTimer = setInterval(() => { if (socket.readyState === 1) socket.send('{"type":"ping"}'); }, 10000);
      } else if (m.type === "confirm") {
        // A new phone isn't trusted until someone at the computer approves it.
        setStatus("Waiting for approval…", "wait");
        $("notice").innerHTML = `<div class="notice"><h2>Approve this phone on your computer</h2><div class="code"></div><p>Briefcast on your computer shows the same code. Check it matches, then approve it there. Keep this page open.</p></div>`;
        $("notice").querySelector(".code").textContent = m.code;
      } else if (m.type === "denied") {
        stopped = true; pairKey = "";
        setStatus("Not connected", "");
        notice("Not approved", "This phone wasn't approved on the computer (or nobody answered in time). To try again, scan a new QR code from Briefcast.");
      } else if (m.type === "offer") {
        const existing = offers.get(m.id);
        const offer = existing || { id: m.id, order: offers.size, started: false };
        Object.assign(offer, { name: m.name, size: m.size, mime: m.mime, state: m.state });
        offers.set(m.id, offer);
        render();
        if (m.fresh && !existing) {
          toast(`Receiving ${m.name}`);
          if (navigator.vibrate) navigator.vibrate(30);
          download(offer);
        }
      } else if (m.type === "status") {
        const o = offers.get(m.id);
        if (o) { o.state = m.state; render(); if (m.state === "done") toast(`✓ ${o.name}`); }
      } else if (m.type === "renamed") {
        creds.name = m.name; saveCreds(); $("me").textContent = m.name + " ✎";
      } else if (m.type === "replaced") {
        stopped = true;
        setStatus("Open in another tab", "");
        notice("Briefcast is open in another tab", "This phone is now receiving files there. Reload this page to use it here instead.");
      } else if (m.type === "forget") {
        stopped = true; creds = null; saveCreds(); offers.clear(); render();
        $("me").hidden = true; $("sender").hidden = true;
        setStatus("Disconnected", "");
        notice("This phone was removed", "It was disconnected from Briefcast on the computer. Scan the QR code again to reconnect.");
      }
    };

    socket.onclose = async () => {
      clearInterval(pingTimer);
      if (ws !== socket || stopped) return;
      if (welcomed) { setStatus("Reconnecting…", "wait"); scheduleReconnect(); return; }
      // Closed before we were welcomed: either Briefcast isn't reachable right now, or it refused
      // our credentials. A plain request tells the two apart.
      let reachable = false;
      try { reachable = (await fetch("/ping", { cache: "no-store" })).ok; } catch (_) {}
      if (!reachable) {
        setStatus("Waiting for Briefcast…", "wait");
        notice("Can't reach your computer", "Make sure Briefcast is open and this phone is on the same Wi-Fi. It will reconnect on its own.");
        scheduleReconnect();
      } else {
        creds = null; saveCreds(); pairKey = "";
        setStatus("Not connected", "");
        $("me").hidden = true; $("sender").hidden = true;
        notice("Scan the code again", "This link has expired. In Briefcast, choose Transfer to phone and scan the new QR code.");
      }
    };
  }

  $("me").addEventListener("click", () => {
    const name = prompt("Name this phone (shown in Briefcast):", (creds && creds.name) || defaultName);
    if (name && name.trim() && ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "rename", name: name.trim() }));
  });

  // Mobile browsers drop the socket whenever the page is hidden; come back the moment it's visible.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && !stopped) { attempt = 0; connect(); }
  });
  window.addEventListener("online", () => { attempt = 0; connect(); });

  // Moves onto this computer's trusted HTTPS name if the phone can actually reach it. Bounded by a
  // short timeout: a router that blocks the name, or no internet to resolve it, must not hold up
  // a transfer that works fine over HTTP.
  async function upgradeToHttps() {
    if (secure) return false;
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 3500);
    try {
      const target = await fetch("/tls", { cache: "no-store", signal: ctl.signal });
      if (!target.ok) return false;
      const { https } = await target.json();
      const probe = await fetch(`${https}/ping`, { cache: "no-store", mode: "cors", signal: ctl.signal });
      if (!probe.ok) return false;
      const p = new URLSearchParams();
      if (pairKey) p.set("k", pairKey);
      if (creds) { p.set("d", creds.d); p.set("t", creds.t); if (creds.name) p.set("n", creds.name); }
      const hash = p.toString();
      location.replace(`${https}/${hash ? "#" + hash : ""}`);
      return true;
    } catch (_) {
      return false;
    } finally {
      clearTimeout(timer);
    }
  }

  setStatus("Connecting…", "wait");
  upgradeToHttps().then((moved) => { if (!moved) connect(); });
})();
</script>
</body>
</html>
