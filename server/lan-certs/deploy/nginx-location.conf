# Add inside the existing withbriefs.com `server { ... }` block (the one serving HTTPS).
location /briefcast-lan/ {
    proxy_pass http://127.0.0.1:8787/;
    # If withbriefs.com is proxied by Cloudflare (orange cloud), the real client address is in
    # CF-Connecting-IP; otherwise use $remote_addr instead.
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    # Issuing waits on Let's Encrypt checking DNS - usually 5-30 seconds.
    proxy_read_timeout 120s;
    client_max_body_size 16k;
}
