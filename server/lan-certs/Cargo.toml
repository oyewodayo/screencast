[package]
name = "briefcast-lan-certs"
version = "0.1.0"
edition = "2021"
publish = false
description = "Gives each Briefcast install its own HTTPS certificate for talking to phones on the local network."

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
instant-acme = { version = "=0.8.5", default-features = false, features = ["ring", "hyper-rustls"] }
hickory-proto = { version = "=0.24.4", default-features = false }
x509-parser = { version = "0.16", features = ["verify"] }
rand = "0.8"
sha2 = "0.10"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
