name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test

  rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      # tauri.conf.json's `bundle.resources` globs binaries/{ffmpeg,heif,whisper}/*, and
      # tauri-build FAILS the build script outright when a resource glob matches nothing:
      #   "glob pattern binaries/ffmpeg/* path not found or didn't match any files"
      # Those binaries are gitignored (`binaries/*` in .gitignore), so a CI checkout never has
      # them - which broke `cargo test` on every platform, inside the build script, before a
      # single test compiled or ran. Nothing in CI bundles, so one placeholder file per folder is
      # all the glob needs. The filename must NOT start with a dot, and `shell: bash` is explicit
      # because windows-latest defaults to pwsh, where `mkdir -p` and `touch` don't exist.
      - name: Satisfy bundle.resources globs (binaries/ are gitignored)
        shell: bash
        run: |
          mkdir -p binaries/ffmpeg binaries/heif binaries/whisper
          touch binaries/ffmpeg/placeholder binaries/heif/placeholder binaries/whisper/placeholder
      # Not `tauri build`/`--features custom-protocol` - that needs the bundled ffmpeg/heif binary
      # resources and the full Tauri bundling toolchain, neither of which this test suite (pure
      # unit tests only, see conversion.rs's own #[cfg(test)] module) actually needs.
      - run: cargo test

  # Linux/macOS counterparts to the Windows-only `rust` job above - added alongside the new
  # services/heic_unix.rs (macOS/Linux HEIC decode via a system-installed libheif). This is also
  # the FIRST time this crate has ever been compiled on either platform - the platform-specific
  # modules under commands/{recording,window_capture}/{linux,macos}.rs were written to be portable
  # but never actually build-verified before now. A failure here that's unrelated to HEIC (i.e. in
  # those existing platform modules, not heic_unix.rs) is a real, separate finding - report it
  # rather than assuming this workflow file did something wrong.
  rust-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      # libheif-examples provides heif-convert/heif-thumbnailer/heif-enc - see heic_unix.rs's own
      # doc comment for why this app shells out to a system install rather than bundling/linking
      # libheif itself.
      #
      # Everything after it is Tauri v2's own Linux build prerequisite set, which this job was
      # missing entirely: the crate graph pulls in webkit2gtk-sys 2.x, soup3-sys and glib-sys (see
      # Cargo.lock), and their build scripts pkg-config against system libraries ubuntu-latest
      # does not ship by default. Note 4.1/3.0 - the 4.0/2.4 packages are Tauri v1's and do not
      # satisfy v2.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-examples libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev \
            libssl-dev build-essential curl wget file
      # See the `rust` job's copy of this step for why it exists.
      - name: Satisfy bundle.resources globs (binaries/ are gitignored)
        shell: bash
        run: |
          mkdir -p binaries/ffmpeg binaries/heif binaries/whisper
          touch binaries/ffmpeg/placeholder binaries/heif/placeholder binaries/whisper/placeholder
      - run: cargo test

  rust-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: brew install libheif
      # See the `rust` job's copy of this step for why it exists.
      - name: Satisfy bundle.resources globs (binaries/ are gitignored)
        shell: bash
        run: |
          mkdir -p binaries/ffmpeg binaries/heif binaries/whisper
          touch binaries/ffmpeg/placeholder binaries/heif/placeholder binaries/whisper/placeholder
      - run: cargo test
