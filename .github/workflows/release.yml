name: Release

# Builds the Windows, macOS and Linux installers and publishes them to one DRAFT GitHub Release.
#
#   1. Bump "version" in src-tauri/tauri.conf.json (+ Cargo.toml / package.json to match).
#   2. git tag v<that version> && git push origin v<that version>
#   3. Review the draft on GitHub, then click Publish. Only a published (non-draft, non-prerelease)
#      release becomes /releases/latest, which is what the in-app updater and the website's
#      download link both point at - so nothing reaches users until you publish.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY           required - contents of the updater private key file
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  required - its password
#   BRIEFCAST_POSTHOG_KEY               optional - usage analytics, PostHog project token (phc_...)
#                                       (src-tauri/src/services/telemetry.rs)
#   BRIEFCAST_SENTRY_DSN                optional - crash reports (same file)
#   BRIEFCAST_GOOGLE_CLIENT_ID / BRIEFCAST_GOOGLE_CLIENT_SECRET
#                                       needed for Share -> YouTube / Drive - the OAuth client of the
#                                       desktop-app credential. Unset = the Share panel says Google
#                                       sign-in isn't set up (src-tauri/src/services/google_share.rs)
#   AZURE_CLIENT_ID / AZURE_CLIENT_SECRET / AZURE_TENANT_ID
#                                       optional - Windows code signing via Azure Trusted Signing
# Variables (same page, Variables tab):
#   BRIEFCAST_LAN_TLS_API               optional - base URL of server/lan-certs, e.g.
#                                       https://withbriefs.com/briefcast-lan. Unset = phone transfer
#                                       stays on plain HTTP (src-tauri/src/services/lan_tls.rs)
# Variables only for code signing:
#   AZURE_SIGNING_ENDPOINT              e.g. https://eus.codesigning.azure.net
#   AZURE_SIGNING_ACCOUNT               the Trusted Signing account name
#   AZURE_SIGNING_PROFILE               the certificate profile name
# Without the AZURE_* values the installers are built unsigned (SmartScreen will warn on install).
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD (an app-specific password), APPLE_TEAM_ID
#                                       optional - sign and notarize the macOS app. Without them it
#                                       is built unsigned: macOS asks the user to right-click >
#                                       Open the first time.
#
# The three builds run one after another, not side by side: each adds its platform to the release's
# one latest.json (what the in-app updater reads), and two writing it at once can drop the other's
# entry - Windows' would break auto-update for everyone already installed. A build that fails does
# not stop the next; the draft just lacks that platform, and you can see which in the Actions run.
# macOS and Linux installers do not bundle ffmpeg: Briefcast uses the one installed on the system
# and says so at startup if it is missing or older than 5.1 (services/ffmpeg_check.rs).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The tag check and the release notes, once, for every platform's build.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match tauri.conf.json version ${version}"
            exit 1
          fi

      # The release's notes: release-notes/<tag>.md (e.g. release-notes/v0.1.2.md) when there is
      # one, then the install lines. The website's release notes page renders this same body.
      - name: Release notes
        id: notes
        run: |
          file="release-notes/${GITHUB_REF_NAME}.md"
          [ -f "$file" ] || echo "::warning::No $file - the release has only the install instructions."
          {
            echo "body<<BRIEFCAST_RELEASE_NOTES_EOF"
            if [ -f "$file" ]; then
              cat "$file"
              echo
              echo "---"
              echo
            fi
            echo "**To install**"
            echo
            echo "- **Windows** - download the file ending in **x64-setup.exe**."
            echo "- **macOS** - download the **.dmg** (Apple Silicon and Intel). The first time, right-click Briefcast and choose Open, because the app isn't notarized yet. Briefcast uses the ffmpeg on your Mac: \`brew install ffmpeg\`."
            echo "- **Linux** - download the **.AppImage** (make it executable and run it) or the **.deb** (\`sudo apt install ./Briefcast_*.deb\`). Briefcast uses the ffmpeg on your system, version 5.1 or newer."
            echo
            echo "Already installed? Briefcast will offer this update on its next launch."
            echo "BRIEFCAST_RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      # binaries/ is gitignored (hundreds of MB of ffmpeg/libheif/whisper builds), so the exact
      # files tauri.conf.json bundles are published once as a release asset and pinned here by
      # SHA-256. To change any of them: rebuild the zip with scripts/package-build-binaries.ps1,
      # upload it under a new tag, and update both values below together.
      - name: Fetch bundled binaries
        shell: bash
        env:
          BINARIES_URL: https://github.com/oyewodayo/screencast/releases/download/build-binaries-v1/build-binaries-win-x64.zip
          BINARIES_SHA256: 0b8a3b9a90ca5640a8b96a64990d14840ee70fbaa89ecb0f0a7dbdcdaa5f7f61
        run: |
          curl --location --fail --silent --show-error --retry 3 --output binaries.zip "$BINARIES_URL"
          echo "${BINARIES_SHA256}  binaries.zip" | sha256sum --check

      # Not unzip: build-binaries-v1 was made by Windows PowerShell's Compress-Archive, which stores
      # paths with backslashes - unzip warns about that and exits 1. Expand-Archive reads them as
      # the folder separators they are. (scripts/package-build-binaries.ps1 now writes standard
      # forward-slash zips, so later binaries zips extract cleanly either way.)
      - name: Extract bundled binaries
        shell: pwsh
        run: |
          Expand-Archive -Path binaries.zip -DestinationPath src-tauri -Force
          Remove-Item binaries.zip
          if (-not (Test-Path src-tauri/binaries/ffmpeg/ffmpeg.exe)) { throw "binaries.zip did not extract to src-tauri/binaries/" }
          (Get-ChildItem -Recurse -File src-tauri/binaries).Count

      # Writes a config overlay that adds a signCommand only when signing is configured, so the
      # same workflow produces unsigned test builds until the Azure account exists.
      - name: Configure Windows code signing
        id: signing
        if: vars.AZURE_SIGNING_ACCOUNT != ''
        shell: bash
        run: |
          cargo install trusted-signing-cli --locked
          cat > src-tauri/tauri.signing.conf.json <<EOF
          {
            "bundle": {
              "windows": {
                "signCommand": "trusted-signing-cli -e ${{ vars.AZURE_SIGNING_ENDPOINT }} -a ${{ vars.AZURE_SIGNING_ACCOUNT }} -c ${{ vars.AZURE_SIGNING_PROFILE }} -d Briefcast %1"
              }
            }
          }
          EOF
          echo "args=--config src-tauri/tauri.signing.conf.json" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Read at compile time (option_env!) - unset means telemetry is compiled out entirely.
          BRIEFCAST_POSTHOG_KEY: ${{ secrets.BRIEFCAST_POSTHOG_KEY }}
          # Only for an EU PostHog project: set the variable to https://eu.i.posthog.com
          BRIEFCAST_POSTHOG_HOST: ${{ vars.BRIEFCAST_POSTHOG_HOST }}
          BRIEFCAST_SENTRY_DSN: ${{ secrets.BRIEFCAST_SENTRY_DSN }}
          # Phone transfer's trusted HTTPS certificates (server/lan-certs) - unset compiles it out.
          BRIEFCAST_LAN_TLS_API: ${{ vars.BRIEFCAST_LAN_TLS_API }}
          # Share -> YouTube / Drive sign-in, read at compile time (option_env!) - unset disables it.
          BRIEFCAST_GOOGLE_CLIENT_ID: ${{ secrets.BRIEFCAST_GOOGLE_CLIENT_ID }}
          BRIEFCAST_GOOGLE_CLIENT_SECRET: ${{ secrets.BRIEFCAST_GOOGLE_CLIENT_SECRET }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Briefcast v__VERSION__
          releaseBody: ${{ needs.prepare.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ steps.signing.outputs.args }}

  linux:
    needs: [prepare, windows]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    # The oldest runner Tauri v2 supports (webkit2gtk 4.1): an AppImage built here runs on
    # newer systems too, not the other way round.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev build-essential curl wget file \
            libfuse2 xdg-utils
      # No binaries to fetch: the Windows-only resources live in tauri.windows.conf.json, and the
      # .deb declares its ffmpeg dependency in tauri.linux.conf.json.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Read at compile time (option_env!) - unset means telemetry is compiled out entirely.
          BRIEFCAST_POSTHOG_KEY: ${{ secrets.BRIEFCAST_POSTHOG_KEY }}
          # Only for an EU PostHog project: set the variable to https://eu.i.posthog.com
          BRIEFCAST_POSTHOG_HOST: ${{ vars.BRIEFCAST_POSTHOG_HOST }}
          BRIEFCAST_SENTRY_DSN: ${{ secrets.BRIEFCAST_SENTRY_DSN }}
          # Phone transfer's trusted HTTPS certificates (server/lan-certs) - unset compiles it out.
          BRIEFCAST_LAN_TLS_API: ${{ vars.BRIEFCAST_LAN_TLS_API }}
          # Share -> YouTube / Drive sign-in, read at compile time (option_env!) - unset disables it.
          BRIEFCAST_GOOGLE_CLIENT_ID: ${{ secrets.BRIEFCAST_GOOGLE_CLIENT_ID }}
          BRIEFCAST_GOOGLE_CLIENT_SECRET: ${{ secrets.BRIEFCAST_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Briefcast v__VERSION__
          releaseBody: ${{ needs.prepare.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

  macos:
    needs: [prepare, windows, linux]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      # Signing and notarization, only when the Apple secrets exist: written into the environment
      # for the build step, so without them the app is simply built unsigned.
      - name: Apple signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::notice::No APPLE_CERTIFICATE - the macOS app is built unsigned."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
      # One universal app (Apple Silicon and Intel in a single .dmg).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Read at compile time (option_env!) - unset means telemetry is compiled out entirely.
          BRIEFCAST_POSTHOG_KEY: ${{ secrets.BRIEFCAST_POSTHOG_KEY }}
          # Only for an EU PostHog project: set the variable to https://eu.i.posthog.com
          BRIEFCAST_POSTHOG_HOST: ${{ vars.BRIEFCAST_POSTHOG_HOST }}
          BRIEFCAST_SENTRY_DSN: ${{ secrets.BRIEFCAST_SENTRY_DSN }}
          # Phone transfer's trusted HTTPS certificates (server/lan-certs) - unset compiles it out.
          BRIEFCAST_LAN_TLS_API: ${{ vars.BRIEFCAST_LAN_TLS_API }}
          # Share -> YouTube / Drive sign-in, read at compile time (option_env!) - unset disables it.
          BRIEFCAST_GOOGLE_CLIENT_ID: ${{ secrets.BRIEFCAST_GOOGLE_CLIENT_ID }}
          BRIEFCAST_GOOGLE_CLIENT_SECRET: ${{ secrets.BRIEFCAST_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Briefcast v__VERSION__
          releaseBody: ${{ needs.prepare.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target universal-apple-darwin
